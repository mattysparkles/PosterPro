name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Backend compileall
        run: |
          PYTHONPATH=backend python -m compileall backend/app

      - name: Backend tests (targeted)
        run: |
          PYTHONPATH=backend pytest \
            backend/tests/test_startup_schema_compat.py \
            backend/tests/test_auth.py \
            backend/tests/test_marketplace_setup.py \
            backend/tests/test_marketplace_setup_health.py \
            backend/tests/test_marketplace_api.py \
            backend/tests/test_storage_unit_batch_e2e.py \
            backend/tests/test_ebay_publish_e2e.py \
            backend/tests/test_marketplace_bridge_connect_sessions.py \
            backend/tests/test_marketplace_job_summaries.py \
            backend/tests/test_marketplace_publish_paths.py \
            backend/tests/test_marketplace_import_paths.py \
            backend/tests/test_marketplace_job_recovery.py \
            -q

      - name: Bridge compileall
        run: |
          PYTHONPATH=bridge python -m compileall bridge/app

      - name: Bridge tests (targeted)
        run: |
          PYTHONPATH=bridge pytest bridge/tests/test_browser_runner_assets.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build
