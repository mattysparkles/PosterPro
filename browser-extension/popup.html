<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PosterPro Marketplace Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">PosterPro</p>
        <h1>Marketplace Assistant</h1>
        <p class="lede">Capture the current marketplace session and hand it to PosterPro for assisted publishing.</p>
      </header>

      <section class="card">
        <label>
          PosterPro base URL
          <input id="posterproBaseUrl" type="url" placeholder="https://posterpro.sparkleserver.site" />
        </label>
        <label>
          Default marketplace
          <select id="defaultMarketplace">
            <option value="facebook">Facebook</option>
            <option value="mercari">Mercari</option>
            <option value="poshmark">Poshmark</option>
            <option value="etsy">Etsy</option>
            <option value="depop">Depop</option>
            <option value="whatnot">Whatnot</option>
            <option value="vinted">Vinted</option>
          </select>
        </label>
        <div class="grid">
          <button id="captureButton" class="primary">Capture session</button>
          <button id="sendButton" class="secondary">Send to PosterPro</button>
        </div>
        <button id="copyButton" class="tertiary">Copy session JSON</button>
      </section>

      <section class="card">
        <div class="row">
          <strong>Current site</strong>
          <span id="siteLabel">Not captured</span>
        </div>
        <div class="row">
          <strong>Last import</strong>
          <span id="importLabel">None</span>
        </div>
        <pre id="status" class="status">Ready.</pre>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
