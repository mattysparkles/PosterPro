<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PosterPro Extension Options</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 24px; max-width: 760px; color: #101828; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input, select { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 10px; }
      button { margin-top: 18px; padding: 10px 14px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
      .hint { color: #475467; font-size: 14px; line-height: 1.5; }
      .status { margin-top: 12px; padding: 12px; background: #f2f4f7; border-radius: 10px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>PosterPro Marketplace Assistant</h1>
    <p class="hint">Set the PosterPro base URL and the default marketplace used by the popup. The extension posts captured session state back into PosterPro over the authenticated browser session.</p>
    <label>
      PosterPro base URL
      <input id="posterproBaseUrl" type="url" placeholder="https://posterpro.sparkleserver.site" />
    </label>
    <label>
      Default marketplace
      <select id="defaultMarketplace">
        <option value="facebook">Facebook</option>
        <option value="mercari">Mercari</option>
        <option value="poshmark">Poshmark</option>
        <option value="etsy">Etsy</option>
        <option value="depop">Depop</option>
        <option value="whatnot">Whatnot</option>
        <option value="vinted">Vinted</option>
      </select>
    </label>
    <button id="saveButton">Save</button>
    <div id="status" class="status">Ready.</div>
    <script src="options.js"></script>
  </body>
</html>
